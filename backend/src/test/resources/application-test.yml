# Infrastructure (PostgreSQL, Redis, RabbitMQ) is provided by Testcontainers via @ServiceConnection.

security:
  jwt:
    secret: test-secret-key-that-is-long-enough-for-hs256
    expiration-ms: 3600000

app:
  base-url: http://localhost:3000
  scheduling:
    # Scheduled jobs are triggered explicitly in tests
    enabled: false
  google-books:
    # Tests never reach the real internet
    base-url: http://localhost:1/books/v1
    api-key: ""
  parser:
    browser:
      # Browser tests construct the fetcher themselves (./mvnw verify -Pbrowser)
      enabled: false

logging:
  level:
    kz.nurbolat.bookaggregator: INFO
