spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:1025}

  jpa:
    show-sql: false

server:
  # The frontend's nginx passes the client address in X-Forwarded-For; rate limits count per client, not per proxy
  forward-headers-strategy: native

app:
  base-url: ${APP_BASE_URL}

logging:
  level:
    kz.nurbolat.bookaggregator: INFO
