<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Сброс пароля</title>
</head>
<body style="margin:0;padding:0;background:#F4F6F8;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F6F8;padding:24px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="max-width:560px;background:#FFFFFF;border-radius:12px;">
                <th:block th:replace="~{email/layout :: header}"></th:block>
                <tr>
                    <td style="padding:8px 32px 16px 32px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;color:#0E1A2B;">
                        <h1 style="margin:0 0 16px 0;font-size:22px;line-height:28px;">Сброс пароля</h1>
                        <p style="margin:0 0 8px 0;" th:text="${name} != null ? 'Здравствуйте, ' + ${name} + '!' : 'Здравствуйте!'">Здравствуйте!</p>
                        <p style="margin:0;">Мы получили запрос на смену пароля. Нажмите кнопку и задайте новый пароль.</p>
                        <th:block th:replace="~{email/layout :: button(${link}, 'Задать новый пароль')}"></th:block>
                        <p style="margin:0 0 8px 0;font-size:13px;line-height:20px;color:#6B7280;">Ссылка действует 1 час
                            и работает один раз. Если кнопка не работает, откройте ссылку:</p>
                        <p style="margin:0;font-size:13px;line-height:20px;word-break:break-all;">
                            <a th:href="${link}" th:text="${link}" href="#" style="color:#C2410C;">ссылка</a>
                        </p>
                        <p style="margin:16px 0 0 0;font-size:13px;line-height:20px;color:#6B7280;">Если вы не просили сбросить
                            пароль, ничего не делайте — пароль останется прежним.</p>
                    </td>
                </tr>
                <th:block th:replace="~{email/layout :: footer}"></th:block>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
