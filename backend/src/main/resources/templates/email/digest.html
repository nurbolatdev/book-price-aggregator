<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Сводка цен</title>
</head>
<body style="margin:0;padding:0;background:#F4F6F8;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F6F8;padding:24px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="max-width:560px;background:#FFFFFF;border-radius:12px;">
                <th:block th:replace="~{email/layout :: header}"></th:block>
                <tr>
                    <td style="padding:8px 32px 8px 32px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;color:#0E1A2B;">
                        <h1 style="margin:0 0 8px 0;font-size:22px;line-height:28px;">Сводка цен за сутки</h1>
                        <p style="margin:0 0 8px 0;" th:text="${name} != null ? 'Здравствуйте, ' + ${name} + '! Ваши маячки сработали:' : 'Здравствуйте! Ваши маячки сработали:'">Здравствуйте!</p>
                    </td>
                </tr>
                <tr th:each="item : ${items}">
                    <td style="padding:12px 32px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:20px;color:#0E1A2B;border-top:1px solid #E5E7EB;">
                        <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
                            <tr>
                                <td th:if="${item.coverUrl}" width="64" valign="top" style="padding-right:12px;">
                                    <img th:src="${item.coverUrl}" src="#" width="64" alt="Обложка"
                                         style="display:block;width:64px;height:auto;border-radius:4px;border:1px solid #E5E7EB;">
                                </td>
                                <td valign="top">
                                    <p style="margin:0;font-size:16px;font-weight:bold;" th:text="${item.title}">Название</p>
                                    <p th:if="${item.author}" style="margin:0 0 6px 0;color:#6B7280;" th:text="${item.author}">Автор</p>
                                    <p style="margin:0;">
                                        <span th:if="${item.oldPriceText}" style="color:#6B7280;text-decoration:line-through;" th:text="${item.oldPriceText}">3 610 ₸</span>
                                        <span th:if="${item.oldPriceText}" style="color:#6B7280;">&nbsp;→&nbsp;</span>
                                        <span style="font-size:18px;font-weight:bold;" th:text="${item.newPriceText}">3 150 ₸</span>
                                        <span th:if="${item.savingPercent}" style="color:#15803D;font-weight:bold;" th:text="' −' + ${item.savingPercent} + '%'">−12%</span>
                                    </p>
                                    <p style="margin:4px 0 0 0;">
                                        <a th:href="${item.offerUrl}" href="#" style="color:#C2410C;font-weight:bold;" th:text="'Открыть в ' + ${item.storeName}">Открыть в Flip.kz</a>
                                        &nbsp;·&nbsp;
                                        <a th:href="${item.editionUrl}" href="#" style="color:#C2410C;">Сравнить все цены</a>
                                        &nbsp;·&nbsp;
                                        <a th:href="${item.unsubscribeUrl}" href="#" style="color:#6B7280;">Отключить маячок</a>
                                    </p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td style="padding:12px 32px 16px 32px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#6B7280;border-top:1px solid #E5E7EB;">
                        Сводка приходит раз в день, потому что в настройках выбрано «раз в день».
                        <a th:href="${settingsUrl}" href="#" style="color:#6B7280;">Настройки уведомлений</a>
                        &nbsp;·&nbsp;
                        <a th:href="${beaconsUrl}" href="#" style="color:#6B7280;">Мои маячки</a>
                    </td>
                </tr>
                <th:block th:replace="~{email/layout :: footer}"></th:block>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
