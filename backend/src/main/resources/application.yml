spring:
  application:
    name: book-price-aggregator

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/bookaggregator
    username: bookuser
    password: changeme
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  cache:
    type: redis

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # A stopped broker must not hold up the API: publishing fails fast and is logged
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # Failed messages are not put back: after the retries they go to kr.dead-letter
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 5
          max-interval: 15s

  mail:
    host: localhost
    port: 1025

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1KB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:my-super-secret-key-for-dev-only-32chars}
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:30d}
  mail:
    from: ${MAIL_FROM:KitapRadar <no-reply@kitapradar.kz>}
  cors:
    # Comma-separated; Vite dev server by default
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login: { requests: 5, period: 1m }
    register: { requests: 3, period: 1m }
    forgot-password: { requests: 3, period: 1m }
    search: { requests: 60, period: 1m }
    api: { requests: 120, period: 1m }
  admin:
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
  google-books:
    api-key: ${GOOGLE_BOOKS_API_KEY:}
    timeout: 5s
  parser:
    browser:
      # Headless Chromium for JavaScript-rendered stores; needs the browser installed (backend image)
      enabled: ${PARSER_BROWSER_ENABLED:false}

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
  level:
    kz.nurbolat.bookaggregator: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
